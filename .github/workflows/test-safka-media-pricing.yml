name: Test Safqa read-only details and media
on:
  push:
    branches:
      - feature/safka-product-cost-pricing-preview-20261011
    paths:
      - .github/workflows/test-safka-media-pricing.yml
permissions:
  contents: write
jobs:
  media-and-price:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run synthetic media and all-in pricing tests
        shell: bash
        run: |
          if node --test integration/safka/next-stage/pricing-preview.test.mjs; then
            printf 'status=PASS\nmode=SYNTHETIC_ONLY\nprovider_requests=0\n' > integration/safka/next-stage/test-status.txt
          else
            printf 'status=FAIL\nmode=SYNTHETIC_ONLY\nprovider_requests=0\n' > integration/safka/next-stage/test-status.txt
          fi
      - name: Save safe summary on review branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/safka/next-stage/test-status.txt
          git commit -m "test(safka): record media and pricing unit test result" || exit 0
          HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $HEADER" push origin HEAD:feature/safka-product-cost-pricing-preview-20261011
