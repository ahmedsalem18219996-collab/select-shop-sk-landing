name: Verify Safqa home page deep links
on:
  push:
    branches: [qa-safka-main-link-20261011]
    paths: [.github/workflows/qa-safka-final-links.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public SELECT SHOP store and actual product links
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib,subprocess,tempfile,pathlib,time
          urls={
           'homepage':'https://selectshopeg.com/?shop_test=1&safka_review=6aa81321ca38d5013caa41fc#products',
           'root_review_script':'https://selectshopeg.com/v2-live/safka-review-in-store.js?v=20261011-c',
           'root_review_css':'https://selectshopeg.com/v2-live/safka-review-in-store.css?v=20261011-b',
           'admin':'https://selectshopeg.com/ops/orders-v2/',
           'admin_script':'https://selectshopeg.com/ops/orders/app.js?v=safka-main-store-20261011'
          }
          checks={}
          for key,url in urls.items():
            for attempt in range(8):
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'SELECT-SHOP-final-integration-QA','Cache-Control':'no-cache'}),timeout=16) as response:
                  s=response.read(200000).decode('utf-8','replace');status=response.status
                results={
                 'homepage':'id="safkaOwnerProducts" hidden' in s and 'safka-review-in-store.js?v=20261011-c' in s and 'id="checkoutForm"' in s,
                 'root_review_script':'safka_review' in s and 'openProduct(incoming)' in s and 'buy.disabled=true' in s and 'مجفف الأحذية الحراري' in s,
                 'root_review_css':'.ssDraftImageGallery{' in s and '.ssDraftDialog{' in s,
                 'admin':'app.js?v=safka-main-store-20261011' in s,
                 'admin_script':'/?shop_test=1&safka_review=' in s and 'preview/safka-landing/?productId=' not in s
                }
                good=bool(results[key])
                info={'status':status,'passed':good,'sha256':hashlib.sha256(s.encode()).hexdigest()}
                if key.endswith('script'):
                  with tempfile.NamedTemporaryFile(mode='w',suffix='.js') as tmp:
                    tmp.write(s);tmp.flush()
                    info['syntax_passed']=subprocess.run(['node','--check',tmp.name],capture_output=True).returncode==0
                checks[key]=info
                if good:break
              except Exception as e:checks[key]={'error':str(e)[:160]}
              time.sleep(5)
          path=pathlib.Path('integration/safka/final-main-store-check.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(checks,ensure_ascii=False,indent=2),encoding='utf8')
          print(path.read_text())
          PY
      - name: Commit only public diagnostics to QA branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/safka/final-main-store-check.json
          git commit -m "qa(temp): verify main-site supplier product deep links" || exit 0
          HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $HEADER" push origin HEAD:qa-safka-main-link-20261011
