name: SELECT SHOP temporary storefront QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'v2-live/safka-*'
      - 'ci/safka-storefront-qa.mjs'
      - '.github/workflows/select-shop-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: select-shop-temp-qa
  cancel-in-progress: true

jobs:
  verify-storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout temp site only
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check live mobile + desktop supplier product page
        run: node ci/safka-storefront-qa.mjs
      - name: Keep screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: select-shop-temp-qa
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
