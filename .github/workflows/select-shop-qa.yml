name: SELECT SHOP temporary storefront QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'meta-pixel.js'
      - 'v2-live/safka-*'
      - 'v2-live/curated20.css'
      - 'v2-live/tilted-grid-hero.js'
      - 'storefront-v2-live.js'
      - 'ci/safka-storefront-qa.mjs'
      - 'ci/order-intake-readiness.mjs'
      - 'ci/safka-daily-sync.mjs'
      - 'ops/safka-import/index.html'
      - 'v2-live/featured-picks.js'
      - 'v2-live/featured-picks.css'
      - 'ops/safka-import/app.js'
      - 'ops/safka-import/style.css'
      - 'ops/safka-import/edge-functions/safka-github-sync/**'
      - '.github/workflows/select-shop-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: select-shop-temp-qa
  cancel-in-progress: true

jobs:
  verify-storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout temp site only
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate owner pricing / marketing and signed sync JavaScript
        run: |
          node --check v2-live/featured-picks.js
          node --check meta-pixel.js
          node --check storefront-v2-live.js
          node --check v2-live/tilted-grid-hero.js
          node --check v2-live/safka-imported-store.js
          node --check v2-live/safka-cart.js
          node --check v2-live/safka-checkout.js
          node --input-type=module --check < ops/safka-import/app.js
          node ci/order-intake-readiness.mjs
          node --check ci/safka-daily-sync.mjs
          node --input-type=module --check < ops/safka-import/edge-functions/safka-github-sync/index.ts
          node --check ops/safka-import/edge-functions/safka-github-sync/normalize.mjs
          node -e 'const fs=require("node:fs"),assert=require("node:assert/strict");const h=fs.readFileSync("ops/safka-import/index.html","utf8"),s=fs.readFileSync("ops/safka-import/app.js","utf8");for(const id of ["currentAvailableCount","commercialReviewHeading","commercialCpa","commercialReturns","commercialFees","commercialShortlist","downloadCommercialCsv","pilotReturnReserve","pilotExtraReserve","pilotProfitGoal","pilotProducts","pilotReviewStatus","curatedOwnerCount","curatedOwnerArchived","curatedOwnerList","curatedFindProduct","curatedFindButton","curatedFindResults","curatedSave","curatedRefresh"]) assert(h.includes("id=\""+id+"\""),"missing owner dashboard field "+id);assert(s.includes("supplierMediaCoverageIds"),"missing product media check");assert(s.includes("retail_price_verification"),"missing price provenance");'
      - name: Install isolated browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Check live mobile + desktop supplier product page
        run: node ci/safka-storefront-qa.mjs
      - name: Keep screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: select-shop-temp-qa
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
