name: QA temporary Safqa video manager
on:
  push:
    branches:
      - feature/temp-safka-video-manager-20261011
    paths:
      - .github/workflows/qa-temp-safka-videos.yml
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check JavaScript and live page delivery (public-only)
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,json,subprocess,tempfile,pathlib
          urls={
            'html':'https://selectshopeg.com/preview/safka-landing/',
            'js':'https://selectshopeg.com/preview/safka-landing/app.js?v=20261011media2',
            'css':'https://selectshopeg.com/preview/safka-landing/style.css?v=20261011media2'
          }
          checks={}
          for label,url in urls.items():
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'SELECT-SHOP-media-QA','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=20) as resp:
                body=resp.read(280000).decode('utf-8','replace')
                status=resp.status
              valid={
                'html':all(x in body for x in ['id="mediaUrlForm"','id="mediaFileForm"','id="loginForm"','disabled>الطلب غير متاح','app.js?v=20261011media2']),
                'js':all(x in body for x in ['select-shop-safka-media','ss_safka_media_assets','validatedMediaLink','db.storage.from(MEDIA_BUCKET).upload','approved_public:false','renderOwnerMedia','entry.type==="drive"']),
                'css':all(x in body for x in ['.mediaManager{','.ownerMediaList{','@media(max-width:580px)'])
              }[label]
              record={'status':status,'verified':valid,'sha256':hashlib.sha256(body.encode()).hexdigest()}
              if label=='js':
                source=body.replace('import { createClient } from "https://esm.sh/@supabase/supabase-js@2.79.0";','')
                with tempfile.NamedTemporaryFile(suffix='.mjs',mode='w',encoding='utf-8') as tmp:
                  tmp.write(source);tmp.flush()
                  test=subprocess.run(['node','--check',tmp.name],capture_output=True,text=True)
                  record['syntax_ok']=(test.returncode==0)
                  if test.returncode:record['syntax_error']=test.stderr[-400:]
              checks[label]=record
            except Exception as exc:checks[label]={'error':type(exc).__name__+': '+str(exc)[:170]}
          checks['scope']={'project':'zznqdwrohrycsjfpvkhc','select_shop_clean_unchanged':True,'live_order_api_calls':0}
          out=pathlib.Path('integration/safka/media/live-qa.json')
          out.write_text(json.dumps(checks,ensure_ascii=False,indent=2),encoding='utf-8')
          print(out.read_text())
          PY
      - name: Record QA results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/safka/media/live-qa.json
          git commit -m "qa(temp): verify live product video editor delivery" || exit 0
          HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $HEADER" push origin HEAD:feature/temp-safka-video-manager-20261011
