name: TirePro original demo video import (one time)
on:
  push:
    paths:
      - .github/workflows/tirepro-video-import-once.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified public product demo MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/ads
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            'https://drive.google.com/uc?export=download&id=1-B9rxqGwIvyTUkB6i24lVaPXWPNCiDUR' \
            --output assets/ads/tirepro-original-demo-21s.mp4
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/ads/tirepro-original-demo-21s.mp4')
          b=p.read_bytes()
          assert len(b)==4351351, f'Unexpected video size: {len(b)} bytes'
          assert b[4:8]==b'ftyp', 'Downloaded resource is not MP4'
          print('Validated MP4',len(b),'bytes')
          PY
      - name: Commit original media once
        shell: bash
        run: |
          git config user.name 'select-shop-media-bot'
          git config user.email 'media-bot@users.noreply.github.com'
          git add assets/ads/tirepro-original-demo-21s.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'media(tirepro): add original video for Meta ad'
            git push origin HEAD:main
          fi
