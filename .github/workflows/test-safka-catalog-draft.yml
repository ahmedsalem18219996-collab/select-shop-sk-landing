name: Test Safqa GET-only connector draft
on:
  push:
    branches:
      - feature/safka-readonly-products-20261011
    paths:
      - .github/workflows/test-safka-catalog-draft.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic-only projection tests
        shell: bash
        run: |
          if node --test integration/safka/catalog-readonly/response-projection.test.mjs; then
            printf 'status=PASS\ntype=SYNTHETIC_ONLY\nreal_safka_requests=0\n' > integration/safka/catalog-readonly/test-status.txt
          else
            printf 'status=FAIL\ntype=SYNTHETIC_ONLY\nreal_safka_requests=0\n' > integration/safka/catalog-readonly/test-status.txt
          fi
      - name: Commit test status to feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/safka/catalog-readonly/test-status.txt
          git commit -m "test(safka): record safe catalog adapter test result" || exit 0
          HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $HEADER" push origin HEAD:feature/safka-readonly-products-20261011
