name: Verify full Safqa import safely
on:
  push:
    branches: [feature/safka-full-catalog-sync-20261011]
    paths: [.github/workflows/qa-full-safka-import.yml]
permissions:
  contents: write
jobs:
  isolated-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate pure normalization with no real provider requests
        shell: bash
        run: |
          set +e
          node --test integration/safka/import/normalize.test.mjs
          a=$?
          node --check integration/safka/import/normalize.mjs
          b=$?
          cp integration/safka/import/edge/index.ts /tmp/safka-import-syntax-check.mjs
          node --check /tmp/safka-import-syntax-check.mjs
          c=$?
          if [ "$a" = 0 ] && [ "$b" = 0 ] && [ "$c" = 0 ]; then
            printf 'status=PASS\nunit_tests=8\nprovider_requests=0\nexternal_orders=0\n' > integration/safka/import/qa-result.txt
          else
            printf 'status=FAIL\nunit_tests=8\nprovider_requests=0\nexternal_orders=0\n' > integration/safka/import/qa-result.txt
          fi
      - name: Save QA status on review branch
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/safka/import/qa-result.txt
          git commit -m "test(safka): record full import synthetic QA" || exit 0
          HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $HEADER" push origin HEAD:feature/safka-full-catalog-sync-20261011
