name: WOMEN Owner Admin and Edge API QA

on:
  push:
    branches: [main, feature/women-claude-admin-catalog]
    paths:
      - "preview/women/**"
      - "ci/women-owner-admin-qa.mjs"
      - ".github/workflows/women-owner-admin-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify responsive Owner login and external WOMEN bridge
        run: node ci/women-owner-admin-qa.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: women-owner-admin-responsive
          path: test-results/women-admin-login-*.png
          if-no-files-found: ignore
          retention-days: 7
