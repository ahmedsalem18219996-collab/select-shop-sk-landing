name: Verify fresh Safqa admin URL
on:
  push:
    branches:
      - feature/safka-diagnose-deploy-20261011
    paths:
      - .github/workflows/check-fresh-safka-url.yml
permissions:
  contents: write
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check new HTML and JS assets from deployed GitHub Pages
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,time,json,pathlib,re
          links={
            'new_admin':"https://selectshopeg.com/ops/orders-v2/",
            'corrected_app':"https://selectshopeg.com/ops/orders/app.js?v=orders-v2-20261011",
            'css':"https://selectshopeg.com/ops/orders/styles.css?v=orders-v2-20261011"
          }
          outcome={}
          for label,url in links.items():
            for attempt in range(7):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'SELECT-SHOP-deployment-check','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=8) as response:
                  data=response.read(150000).decode('utf8','replace')
                  status=response.status
                if label=='new_admin':
                  good='app.js?v=orders-v2-20261011' in data and 'VERSION 2' in data and 'id="safkaTestTable"' in data
                elif label=='corrected_app':
                  good='safqaMoney(' in data and 'safkaMoney(' not in data
                else:good='.safkaTableWrap' in data
                outcome[label]={'status':status,'verified':good,'sha256':hashlib.sha256(data.encode()).hexdigest()}
                if good:break
              except Exception as e:outcome[label]={'error':type(e).__name__}
              time.sleep(6)
          p=pathlib.Path('integration/safka/fresh-url-check.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(outcome,indent=2),encoding='utf8')
          print(p.read_text())
          PY
      - name: Save public deployment test results on feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/safka/fresh-url-check.json
          git commit -m "diagnostics: capture fresh Safqa admin URL status" || exit 0
          HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $HEADER" push origin HEAD:feature/safka-diagnose-deploy-20261011
