name: Diagnose live Safqa admin assets
on:
  push:
    branches:
      - feature/safka-diagnose-deploy-20261011
    paths:
      - .github/workflows/diagnose-safka-live.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect LIVE public assets without any authentication
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,hashlib,json,datetime,re
          paths=[
            "https://selectshopeg.com/ops/orders/",
            "https://selectshopeg.com/ops/orders/app.js",
            "https://selectshopeg.com/ops/orders/app.js?v=safqa-money-fix-20261011",
            "https://selectshopeg.com/ops/orders/app.js?v=safka-table-20261011",
            "https://raw.githubusercontent.com/ahmedsalem18219996-collab/select-shop-sk-landing/main/ops/orders/app.js"
          ]
          results=[]
          for url in paths:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'SelectShop-safe-deploy-inspector/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=15) as r:
                data=r.read(130000).decode('utf-8','replace')
                results.append(dict(url=url,status=r.status,
                  cache_control=r.headers.get('cache-control'),
                  last_modified=r.headers.get('last-modified'),
                  sha256=hashlib.sha256(data.encode()).hexdigest(),
                  app_script_refs=re.findall(r'app\.js\?v=[\w-]+',data),
                  obsoleteCalls=data.count('safkaMoney('),
                  correctCalls=data.count('safqaMoney(')))
            except Exception as e:
              results.append(dict(url=url,error=type(e).__name__+': '+str(e)[:190]))
          import pathlib
          path=pathlib.Path('integration/safka/live-deploy-check.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(dict(checked_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),results=results),ensure_ascii=False,indent=2),encoding='utf8')
          print(path.read_text())
          PY
      - name: Persist public-only deploy diagnosis
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/safka/live-deploy-check.json
          git commit -m "diagnostics: capture public Safqa script delivery" || exit 0
          HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $HEADER" push origin HEAD:feature/safka-diagnose-deploy-20261011
