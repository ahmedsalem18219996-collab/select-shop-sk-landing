name: SELECT SHOP Safqa daily catalog sync
# inclusive_shipping_guard_110: supplier recommended retail + current max active regional delivery (110 EGP), verified by server

# Legacy Safqa/Prof funnel retired: no scheduled or push-triggered supplier sync.
# Preserve a manual-only recovery path; no suppliers, orders or catalog rows are deleted.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: temp-safka-daily-sync
  cancel-in-progress: false

jobs:
  safka-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout SELECT SHOP temporary repo
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify GitHub OIDC and sync Safqa products
        run: node ci/safka-daily-sync.mjs
