name: Temporary orders direct checkout safety
on:
  push:
    branches:
      - feature/temp-direct-checkout-current-v2-20261011
  pull_request:
    paths:
      - "index.html"
      - "storefront-v2-live.js"
      - "direct-order-v2*.js"
      - "orders-system/tests/direct-order-v2-safety.test.cjs"
      - "orders-system/tests/remote-edge-readiness.test.cjs"
      - ".github/workflows/temp-order-checkout-ready.yml"
permissions:
  contents: read
jobs:
  read-only-and-mock-tests:
    name: Validate disabled-by-default checkout and remote fail-closed Edge
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check JS syntax
        run: |
          node --check storefront-v2-live.js
          node --check direct-order-v2.js
          node --check direct-order-v2-config.js
      - name: Mock tests: no customer data or API requests
        run: node --test orders-system/tests/direct-order-v2-safety.test.cjs
      - name: Safe remote Edge tests: preflight, invalid origin and invalid JSON
        run: node --test orders-system/tests/remote-edge-readiness.test.cjs
