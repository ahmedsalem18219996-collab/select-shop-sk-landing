name: WOMEN Admin V3 authenticated access QA

on:
  push:
    branches: [main, fix/women-admin-v3-require-login]
    paths:
      - "preview/women/admin-v3/**"
      - "ci/women-admin-v3-auth-qa.mjs"
      - ".github/workflows/women-admin-v3-auth-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-login:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: No-password-demo bypass and real Auth login regression
        run: node ci/women-admin-v3-auth-qa.mjs
      - name: Upload login screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: women-admin-v3-secure-login
          path: test-results/women-admin-v3-login-390.png
          if-no-files-found: ignore
          retention-days: 7
