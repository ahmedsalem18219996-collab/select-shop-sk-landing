name: QA Safqa staging inside live temp store
on:
  push:
    branches: [qa-safka-root-review-20261011]
    paths: [.github/workflows/qa-safka-root-review.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the real .com main page and scripts (no credentials)
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,pathlib,json,subprocess,tempfile,time
          paths={
            'store':'https://selectshopeg.com/?shop_test=1',
            'script':'https://selectshopeg.com/v2-live/safka-review-in-store.js?v=20261011-a',
            'css':'https://selectshopeg.com/v2-live/safka-review-in-store.css?v=20261011-a',
            'preview':'https://selectshopeg.com/preview/safka-landing/'
          }
          found={}
          for kind,url in paths.items():
            for tries in range(9):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'SELECT-SHOP-root-staging-QA','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=14) as resp:
                  body=resp.read(120000).decode('utf-8','replace')
                  status=resp.status
                conditions={
                  'store': 'id="safkaOwnerProducts" hidden' in body and 'safka-review-in-store.js?v=20261011-a' in body and 'id="checkoutForm"' in body,
                  'script': 'if(window.SELECT_SHOP_TEST_MODE!==true)return' in body and 'مجفف الأحذية الحراري' in body and 'buy.disabled=true' in body and 'safkaOwnerProducts' in body,
                  'css': '.ssDraftSection' in body and '.ssDraftGrid' in body and '@media(max-width:480px)' in body,
                  'preview': 'id="loginForm"' in body and 'id="mediaUrlForm"' in body
                }
                ok=conditions[kind]
                result={'status':status,'passes':ok,'sha256':hashlib.sha256(body.encode()).hexdigest()}
                if kind=='script':
                  with tempfile.NamedTemporaryFile(suffix='.js',mode='w') as f:
                    f.write(body);f.flush()
                    cmd=subprocess.run(['node','--check',f.name],capture_output=True,text=True)
                    result['syntax_passes']=cmd.returncode==0
                found[kind]=result
                if ok:break
              except Exception as exc:found[kind]={'error':type(exc).__name__+': '+str(exc)[:130]}
              time.sleep(5)
          out=pathlib.Path('integration/safka/root-store-qa.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(found,ensure_ascii=False,indent=2),encoding='utf-8')
          print(out.read_text())
          PY
      - name: Preserve public-only QA result on QA branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/safka/root-store-qa.json
          git commit -m "qa(temp): verify actual homepage Safqa review delivery" || exit 0
          HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $HEADER" push origin HEAD:qa-safka-root-review-20261011
