<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SELECT SHOP V2 — Lime Atelier QA</title><style>
*{box-sizing:border-box}body{background:#11160e;color:#f1f7e9;font:13px/1.85 Tahoma,Arial,sans-serif;margin:0;padding:18px}
h1{font-size:20px;margin:0}p{font-size:11px;color:#c2d0b7}
.results{padding:16px;border:1px solid #4f6340;background:#20291b;border-radius:7px;margin:16px 0}
.result{border-bottom:1px solid #455b3b;padding:7px 0;font-size:11px}.pass{color:#b4ed90}.fail{color:#ffa6a9}
.frames{display:flex;align-items:start;gap:20px;flex-wrap:wrap;direction:ltr}
.frame{display:flex;flex-direction:column;gap:7px}.frame strong{font:700 13px Tahoma;color:#dbfb65}
iframe{box-sizing:content-box;border:5px solid #657b50;width:390px;height:844px;background:white;border-radius:12px}
#i320{width:320px;height:720px}#i768{width:768px;height:720px}@media(max-width:850px){#i768{display:none}}
</style></head><body><h1>SELECT SHOP / LIME ATELIER — V2 QA</h1><p>اختبار المقاسات والأسعار والسلة وبطاقات المنتجات بعد إعادة التصميم. لا يُرسل أي طلب. يختبر الموبايل بعرض 320 و390px حقيقي.</p><div class="results" id="results">جاري تشغيل الفحوص…</div><div class="frames"><div class="frame"><strong>390 × 844</strong><iframe id="i390" width="390" height="844" src="/preview/select-v2/?qa=390"></iframe></div><div class="frame"><strong>320 × 720</strong><iframe id="i320" width="320" height="720" src="/preview/select-v2/?qa=320"></iframe></div><div class="frame"><strong>768 × 720</strong><iframe id="i768" width="768" height="720" src="/preview/select-v2/?qa=768"></iframe></div></div>
<script>
const results=document.getElementById("results"),tests=[];
function test(label,ok,note=""){tests.push({label,ok,note});results.innerHTML="<strong>"+tests.filter(t=>t.ok).length+"/"+tests.length+" PASS</strong>"+tests.map(t=>'<div class="result '+(t.ok?'pass':'fail')+'">'+(t.ok?'✓':'✕')+' '+t.label+' — '+t.note+'</div>').join("")}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const load=f=>new Promise(done=>{if(f.contentDocument?.readyState==="complete")return done();f.addEventListener('load',done,{once:true});setTimeout(done,11000)});
async function run(){
const frames=[document.getElementById('i390'),document.getElementById('i320'),document.getElementById('i768')];
await Promise.all(frames.map(load));await wait(2200);
for(const [n,f] of frames.entries()){
 const w=f.contentWindow,d=f.contentDocument,v=[390,320,768][n];
 test(v+'px no horizontal overflow',w.innerWidth===v&&d.documentElement.scrollWidth<=v,'width '+w.innerWidth+' / scrollWidth '+d.documentElement.scrollWidth);
 const hero=d.querySelector('#heroTitle');
 test(v+'px no old hero product photos',!!hero&&hero.textContent.includes('DISCOVER')&&d.querySelectorAll('.heroProductTile').length===0,'hero: '+hero?.textContent.trim().slice(0,43));
 test(v+'px bottom/cart/navigation',!!d.querySelector('.cartAction')&&(v>620||w.getComputedStyle(d.querySelector('.mobileBar')).display!=='none'),'fixed dock '+w.getComputedStyle(d.querySelector('.mobileBar')).display);
}
const w=frames[0].contentWindow,d=frames[0].contentDocument;
const products=d.querySelectorAll('#productGrid .productCard');
test('all 5 unified product cards',products.length===5&&!!d.querySelector('.unifiedCardsGrid [data-product-id=carwash48]'),'count '+products.length);
test('exact 4 shoe and 1 car',d.querySelectorAll('.unifiedCardsGrid [data-product-id]:not([data-product-id=carwash48])').length===4&&d.querySelectorAll('[data-product-id=carwash48]').length===1,'4 footwear + 1 car-care');
test('electric lime palette',w.getComputedStyle(d.documentElement).getPropertyValue('--lime').trim()==='#defc48','brand var '+w.getComputedStyle(d.documentElement).getPropertyValue('--lime'));
test('animated marquee and brand',w.getComputedStyle(d.querySelector('.tickerTrack')).animationName!=='none'&&w.getComputedStyle(d.querySelector('.premiumBrand .brandWord')).animationName.includes('brandLetterFloat'),'ticker/brand');
test('image edge glow animation',w.getComputedStyle(d.querySelector('.cardMedia'),'::after').animationName.includes('edgeLightTravel'),'edge '+w.getComputedStyle(d.querySelector('.cardMedia'),'::after').animationName);
test('feedback annotator present',!!d.querySelector('#v2fbPick')&&!!d.querySelector('.v2FeedbackLauncher'),'feedback selector');
const prior=w.localStorage.getItem('selectShopReviewV2:cart');
try{
 d.querySelector('.mobileCategoryRail [data-nav-filter=car]')?.click();
 test('car category filter',d.querySelectorAll('#productGrid .productCard').length===1&&!!d.querySelector('#productGrid [data-product-id=carwash48]'),'filtered');
 d.querySelector('.mobileCategoryRail [data-nav-filter=all]')?.click();
 test('all category restores cards',d.querySelectorAll('#productGrid .productCard').length===5,'restored');
 const sk=d.querySelector('[data-product-id=sk] [data-show-product]');sk?.click();
 test('shoe detail sizes',d.querySelector('#productDialog')?.open===true&&d.querySelectorAll('#detailSizes [data-size]').length>0,'shoe dialog');
 d.querySelector('#detailSizes [data-size]')?.click();d.querySelector('#addToCart')?.click();
 test('SK cart adds without real checkout',d.querySelector('#cartDialog')?.open===true&&d.querySelector('#cartMath')?.textContent.includes('٦٨٠'),'SK 680');
 d.querySelector('[data-close=cartDialog]')?.click();
 d.querySelector('[data-product-id=alex] [data-show-product]')?.click();
 d.querySelector('#detailSizes [data-size]')?.click();d.querySelector('#addToCart')?.click();
 test('80 EGP extra-pair discount',d.querySelector('#cartMath')?.textContent.includes('٨٠'),'shoe discount 80');
 d.querySelector('[data-close=cartDialog]')?.click();
 d.querySelector('[data-product-id=carwash48] [data-show-product]')?.click();
 test('car no shoe sizing',d.querySelector('#productDialog')?.open===true&&d.querySelector('#sizeStep')?.hidden===true,'no size');
 d.querySelector('#addToCart')?.click();
 const t=d.querySelector('.cartGrand')?.textContent||'';
 test('mixed order 2139 EGP',t.includes('٢٬١٣٩')||t.includes('٢,١٣٩')||t.includes('2139'),'total: '+t.trim());
 d.querySelector('#goCheckout')?.click();
 test('preview order never sends',d.querySelector('#checkoutDialog')?.open===true&&d.querySelector('#checkoutSummary')?.textContent.includes('مقترح'),'preview shipping');
}catch(e){test('checkout interactive exception',false,String(e))}
finally{
 if(prior===null)w.localStorage.removeItem('selectShopReviewV2:cart');
 else w.localStorage.setItem('selectShopReviewV2:cart',prior);
}
}
run();
</script></body></html>
